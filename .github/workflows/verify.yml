name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run hardware-free regression suite
        run: dotnet run --project IRCamera.Tests/GW192A.ThermalCameraViewer.Tests.csproj -c Release
      - name: Verify framework-dependent single-file publish
        run: dotnet publish IRCamera/GW192A.ThermalCameraViewer.csproj -c Release -o artifacts/ci-publish
